name: Build JRE8 aarch64 for Android (jdk8u382-b05)

on:
  workflow_dispatch:

jobs:
  build_aarch64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts (PojavLauncherTeam, branch buildjre8)
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/android-openjdk-build-multiarch
          ref: buildjre8

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf python3 python-is-python3 unzip zip             systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev             libelf-dev libfontconfig1-dev libx11-dev

      - name: Set up boot JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: zulu

      - name: Patch clonejdk.sh (pin jdk8u382-b05)
        run: |
          cat > clonejdk.sh <<'EOF'
          #!/bin/bash
          set -e
          echo ">>> Building jdk8u382-b05 (closest public source to 8u381)"
          git clone --depth 1 --branch jdk8u382-b05 https://github.com/openjdk/jdk8u openjdk
          EOF

      - name: Build JRE8 for Android aarch64
        run: |
          export AUTOCONF_EXTRA_ARGS="--with-milestone=fcs --with-update-version=381 --with-build-number=b09"
          bash ci_build_arch_aarch64.sh
        shell: bash

      - name: Upload JRE8 (importable into MojoLauncher as-is)
        uses: actions/upload-artifact@v4
        with:
          name: jre8-arm64
          path: jre8*.tar.xz
          if-no-files-found: error
