name: Build JRE8 aarch64 for Android (8u381-b09 / 8u382-b05)

on:
  workflow_dispatch:

jobs:
  build_aarch64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts (PojavLauncherTeam, branch buildjre8)
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/android-openjdk-build-multiarch
          ref: buildjre8

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install autoconf python3 python-is-python3 unzip zip \
            systemtap-sdt-dev gcc-multilib g++-multilib libxtst-dev libasound2-dev \
            libelf-dev libfontconfig1-dev libx11-dev mercurial

      - name: Set up boot JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: zulu

      - name: Probe Oracle hg and pin source
        run: |
          if hg identify https://hg.openjdk.org/jdk8u/jdk8u -r jdk8u381-b09 2>/dev/null; then
            echo "8u381-b09" > pinned_source.txt
          else
            echo "8u382-b05" > pinned_source.txt
          fi
          cat pinned_source.txt

      - name: Patch clonejdk.sh (pinned source)
        run: |
          if grep -q "8u381-b09" pinned_source.txt; then
          cat > clonejdk.sh <<'EOF'
          #!/bin/bash
          set -e
          echo ">>> Building TRUE jdk8u381-b09 from Oracle hg"
          hg clone -r jdk8u381-b09 https://hg.openjdk.org/jdk8u/jdk8u openjdk
          EOF
          echo "STAMP=--with-milestone=fcs --with-update-version=381 --with-build-number=b09" > stamp.txt
          else
          cat > clonejdk.sh <<'EOF'
          #!/bin/bash
          set -e
          echo ">>> Oracle hg unreachable; building jdk8u382-b05 (closest public)"
          git clone --depth 1 --branch jdk8u382-b05 https://github.com/openjdk/jdk8u openjdk
          EOF
          echo "STAMP=--with-milestone=fcs --with-update-version=382 --with-build-number=b05" > stamp.txt
          fi
          cat clonejdk.sh stamp.txt

      - name: Build JRE8 for Android aarch64
        run: |
          source stamp.txt
          export AUTOCONF_EXTRA_ARGS="$STAMP"
          bash ci_build_arch_aarch64.sh
        shell: bash

      - name: Upload JRE8 (importable into MojoLauncher as-is)
        uses: actions/upload-artifact@v4
        with:
          name: jre8-arm64
          path: jre8*.tar.xz
          if-no-files-found: error
